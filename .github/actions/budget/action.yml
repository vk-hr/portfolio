name: Job budget
description: Fails the job if setup or the whole job (up to this step) went over budget. Timed from the job's real start, read from the API.

inputs:
  setup-seconds:
    description: Budget from job start until the install finished.
    default: "15"
  job-seconds:
    description: Budget from job start until this step.
    default: "35"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SETUP_BUDGET: ${{ inputs.setup-seconds }}
        JOB_BUDGET: ${{ inputs.job-seconds }}
      run: |
        started=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
          --jq ".jobs[] | select(.name == \"$GITHUB_JOB\") | .started_at | fromdateiso8601")
        now=$(date +%s)
        job=$(( now - started ))
        echo "budget: job ${job} s so far (budget ${JOB_BUDGET} s)"
        failed=0
        if [ -n "${SETUP_DONE:-}" ]; then
          setup=$(( SETUP_DONE - started ))
          echo "budget: setup ${setup} s (budget ${SETUP_BUDGET} s)"
          if [ "$setup" -gt "$SETUP_BUDGET" ]; then
            echo "::error title=Setup over budget::setup took ${setup} s; its budget is ${SETUP_BUDGET} s"
            failed=1
          fi
        fi
        if [ "$job" -gt "$JOB_BUDGET" ]; then
          echo "::error title=Job over budget::${GITHUB_JOB} took ${job} s; its budget is ${JOB_BUDGET} s"
          failed=1
        fi
        exit "$failed"
