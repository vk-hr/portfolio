[fmt]
# Matches the previous Biome style: tabs, double quotes, 80 columns.
useTabs = true
sortImports = true
sortPackageJson = true
ignorePatterns = [
	"src/routeTree.gen.ts",
	".content-collections/",
	".output/",
	"flake.lock",
]

[fmt.sortTailwindcss]
stylesheet = "src/styles.css"
functions = ["cn", "cva"]

[test]
# happy-dom must be registered before anything imports Testing Library.
# (Bun 1.4.5 adds `environment = "happy-dom"`; switch once nixpkgs has it.)
preload = ["./test/happydom.ts", "./test/setup.ts"]
# Random order flushes out tests that depend on each other. A failure prints
# its seed; reproduce with `bun test --seed=<seed>`.
randomize = true
# Isolation (a fresh global and module registry per file) is the `--isolate`
# flag, passed by CI. Bun 1.4.4 silently ignores `isolate = true` here:
# verified with one file leaking a global into another.
